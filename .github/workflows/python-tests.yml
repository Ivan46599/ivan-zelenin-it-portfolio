name: Проверка Python-проектов

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Получение репозитория
        uses: actions/checkout@v7

      - name: Установка Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Обновление pip
        run: python -m pip install --upgrade pip

      - name: Установка зависимостей
        run: |
          python -m pip install pytest
          python -m pip install -r projects/api-data-parser/requirements.txt
          python -m pip install -r projects/student-performance-analysis/requirements.txt

      - name: Проверка синтаксиса Python
        run: python -m compileall projects

      - name: Тесты API Data Parser
        run: python -m pytest projects/api-data-parser/tests -q

      - name: Тесты Maze Pathfinding
        run: python -m pytest projects/maze-pathfinding-python/tests -q

      - name: Тесты Student Performance Analysis
        run: python -m pytest projects/student-performance-analysis/tests -q